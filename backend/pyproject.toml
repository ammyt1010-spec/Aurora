[tool.poetry]
name = "colmena-backend"
version = "0.1.0"
description = "Backend unificado de Colmena (proyectos académicos, CENSOPAS-COPSOQ, surveys, motor estadístico)."
authors = ["Colmena Team"]
readme = "README.md"
package-mode = true
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = ">=0.30.0"
psycopg = { extras = ["binary"], version = "^3.2.3" }
python-dotenv = "^1.0.1"
orjson = "^3.10.7"
numpy = "^2.1.2"        # regresión logística (IRLS), k-means, McDonald omega (PCA)
scipy = "^1.14.1"       # chi-cuadrado, Mann-Whitney, Kruskal-Wallis, Spearman
openpyxl = "^3.1.5"     # export XLSX
bcrypt = "^4.2.0"       # hashing de password
pyjwt = "^2.9.0"        # sesión (JWT)
email-validator = "^2.2.0"  # pydantic EmailStr
python-docx = "^1.2.0"  # reporte exportable en Word (ReportService, output_format=DOCX)
matplotlib = "^3.11.1"  # gráficas embebidas en el reporte Word (backend "Agg", sin display)
pypdf = "^5.1.0"  # conteo de páginas del PDF de preview (conversión real vía LibreOffice)
# No instalados (SPSS/Parquet no implementados — ver README "Limitaciones documentadas"):
#   pyreadstat (SPSS), polars/pyarrow (Parquet), pandas/statsmodels/scikit-learn
#   (no se usan; toda la estadística de este backend está implementada con
#   stdlib + numpy + scipy).

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
aiosqlite = "^0.20.0"
ruff = "^0.6.9"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "--basetemp=tmp/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
