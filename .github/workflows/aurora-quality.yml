name: AURORA Quality Gate
on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install LibreOffice for faithful PDF conversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
      - name: Install backend
        working-directory: backend
        run: poetry install --no-interaction
      - name: Python syntax
        working-directory: backend
        run: poetry run python -m compileall -q app
      - name: Security unit tests
        working-directory: backend
        env:
          ENVIRONMENT: test
        run: poetry run pytest -q app/tests/unit/test_aurora_access.py
      - name: Full backend regression suite
        working-directory: backend
        env:
          ENVIRONMENT: test
        run: poetry run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reconcile inherited lockfile and install frontend
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Verify lockfile debt
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            echo "::warning::Existing frontend/package-lock.json is out of sync; commit a regenerated lockfile before production release."
          fi
      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build
      - name: Frontend tests
        working-directory: frontend
        run: npm test
