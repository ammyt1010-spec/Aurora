name: AURORA BI release checks

on:
  push:
    branches:
      - feat/aurora-three-screen-ux-20261021
      - feat/aurora-executive-single-screen-20261023
      - feat/aurora-final-ux-cleanup-20261023
      - feat/aurora-battery-flow-bi-report-20261024
  pull_request:
    branches:
      - feat/aurora-campaign-invitations-control-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'poetry>=1.8,<2'
      - run: poetry install --with dev --no-interaction --no-ansi
      - run: poetry run python -m compileall -q app
      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer
      - name: Run full backend test suite
        run: poetry run pytest -q app/tests

  migrations:
    name: PostgreSQL 16 migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aurora_ci
          POSTGRES_USER: aurora_ci
          POSTGRES_PASSWORD: aurora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora_ci -d aurora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://aurora_ci:aurora_ci@localhost:5432/aurora_ci
      DATABASE_URL_SYNC: postgresql+psycopg://aurora_ci:aurora_ci@localhost:5432/aurora_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'poetry>=1.8,<2'
      - run: poetry install --with dev --no-interaction --no-ansi
      - run: poetry run alembic upgrade head
      - run: poetry run alembic current
