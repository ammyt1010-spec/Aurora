name: AURORA BI release checks

on:
  push:
    branches:
      - feat/aurora-three-screen-ux-20261021
  pull_request:
    branches:
      - feat/aurora-campaign-invitations-control-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'poetry>=1.8,<2'
      - run: poetry install --with dev --no-interaction --no-ansi
      - run: poetry run python -m compileall -q app
      - run: |
          poetry run pytest -q             app/tests/unit/test_dashboard_preferences.py             app/tests/unit/test_evaluation_bundles.py             app/tests/unit/test_report_docx_render.py             app/tests/integration/test_dashboard_preferences_access.py             app/tests/integration/test_evaluation_bundles_flow.py
