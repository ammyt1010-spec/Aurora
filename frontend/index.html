    <script>
      try {
        const chosenTheme = localStorage.getItem('aurora-theme');
        const useDark = chosenTheme === 'dark' || (chosenTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', useDark);
      } catch (_) { /* Private browsing may deny local storage. */ }
    </script>
